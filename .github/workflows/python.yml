name: Python pipeline

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'firmware/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'docs/**'
      - 'research/**'
      - 'configs/**'
      - 'scripts/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'firmware/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'docs/**'
      - 'research/**'
      - 'configs/**'
      - 'scripts/**'
      - '.github/workflows/python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install software dependencies
        run: |
          python -m pip install -e ".[vision,test,rl,hardware,video]"
          python -m pip check
          python -m pip freeze > environment-resolved.txt
          python -c "from importlib.metadata import distributions; names={d.metadata['Name'].lower() for d in distributions()}; assert names & {'opencv-python','opencv-contrib-python','opencv-python-headless','opencv-contrib-python-headless'} == {'opencv-python'}"
      - name: Unit and environment tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: English repository and synchronized website requirements
        run: |
          python scripts/check_repository.py
          node scripts/build-prd.mjs
          git diff --exit-code -- PRD.md docs/PRD.md docs/prd.html
          node scripts/check-site.mjs
      - name: Offline demo and PPO save/load smoke test
        run: |
          python -m objectpilot.demo --config configs/wall_approach.json --out runs/ci_pid
          python -m objectpilot.train --config configs/wall_approach.json --steps 1024 --seed 0 --out runs/ci_ppo
          python -m objectpilot.evaluate --config configs/wall_approach.json --model runs/ci_ppo/policy.zip --episodes 3 --seed 20000 --out runs/ci_eval
          python -m objectpilot.demo --config configs/wall_approach.json --model runs/ci_ppo/policy.zip --out runs/ci_ppo_demo
      - name: PID tuning workflow and committed tuned-gains smoke test
        run: |
          python -m objectpilot.tune_pid --config configs/wall_approach.json --tuning-episodes 2 --validation-episodes 2 --kp-forward 1.5,2.5 --ki-forward 0 --kd-forward 0.08 --kp-yaw 3.5 --ki-yaw 0 --kd-yaw 0.05 --top 2 --workers 2 --out runs/ci_tuning
          python -m objectpilot.evaluate --config configs/wall_approach.json --gains configs/pid_gains_tuned.json --episodes 3 --seed 30000 --out runs/ci_pid_tuned_eval
          python -m objectpilot.demo --config configs/wall_approach.json --gains configs/pid_gains_tuned.json --out runs/ci_pid_tuned_demo
      - name: Generate firmware from the reviewed upstream revision
        run: |
          git clone https://github.com/RoboMaster/RMTT_Libs.git artifacts/RMTT_Libs
          git -C artifacts/RMTT_Libs checkout b8ece60ec31eeca3350209a2559f549864e91dce
          python firmware/prepare_firmware.py --upstream artifacts/RMTT_Libs --out artifacts/firmware/objectpilot_default
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-evidence-${{ matrix.os }}
          path: |
            environment-resolved.txt
            runs/ci_ppo/metadata.json
            runs/ci_eval/summary.json
            runs/ci_eval/episodes.csv
            runs/ci_tuning/selected_gains.json
            runs/ci_pid_tuned_eval/summary.json
